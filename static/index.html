<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>字幕校稿对齐 · SRT 时间轴重定时</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
  <h1>字幕校稿工具</h1>
  <p class="subtitle">对白稿 × SRT 全局单调对齐 · SRT 时间轴分段线性重定时</p>
  <nav class="tabs" role="tablist">
    <button type="button" class="tab active" id="tabAlign" role="tab">对白稿对齐</button>
    <button type="button" class="tab" id="tabRetime" role="tab">SRT 时间轴重定时</button>
  </nav>
</header>

<main>
  <!-- ============ 对白稿对齐 ============ -->
  <section id="viewAlign">
    <section class="input-grid">
      <div class="pane">
        <div class="pane-head">
          <label for="script">逐行对白稿（每行一句）</label>
          <button type="button" class="ghost" id="sampleScript">填入示例</button>
        </div>
        <textarea id="script" spellcheck="false"
          placeholder="粘贴逐行对白稿，每行一条&#10;例如：&#10;你好世界&#10;今天天气真好"></textarea>
      </div>
      <div class="pane">
        <div class="pane-head">
          <label for="srt">SRT 字幕（保留时间码）</label>
          <button type="button" class="ghost" id="sampleSrt">填入示例</button>
        </div>
        <textarea id="srt" spellcheck="false"
          placeholder="粘贴标准 SRT&#10;1&#10;00:00:01,000 --> 00:00:03,000&#10;你好，世界！"></textarea>
      </div>
    </section>

    <section class="controls">
      <label class="gap-field">跳过单条代价
        <input type="number" id="gapCost" value="0.45" min="0" max="1" step="0.01">
      </label>
      <label class="anchor-field">人工锚点
        <input type="text" id="anchors" spellcheck="false"
          placeholder="行:块，如 3:3, 10:8（可空）">
      </label>
      <button type="button" id="alignBtn" class="primary">开始对齐</button>
      <button type="button" id="clearBtn" class="ghost">清空</button>
      <span id="status" class="status" role="status"></span>
    </section>

    <section id="summary" class="summary hidden">
      <span class="chip chip-match">对位 <b id="cntMatch">0</b></span>
      <span class="chip chip-missing-script">缺对白稿 <b id="cntMissingScript">0</b></span>
      <span class="chip chip-missing-srt">缺字幕 <b id="cntMissingSrt">0</b></span>
      <span class="chip chip-anchor hidden" id="chipAnchor">锚点 <b id="cntAnchor">0</b></span>
      <span class="chip">总行数 <b id="cntTotal">0</b></span>
      <span class="chip">总代价 <b id="totalCost">0</b></span>
      <span class="chip">对位平均代价 <b id="avgCost">-</b></span>
      <button type="button" id="downloadBtn" class="ghost">下载 CSV</button>
    </section>

    <section id="resultWrap" class="result-wrap hidden">
      <table id="resultTable">
        <thead>
          <tr>
            <th class="col-status">状态</th>
            <th class="col-cost">代价</th>
            <th class="col-script">#</th>
            <th class="col-script-text">对白稿</th>
            <th class="col-srt">#</th>
            <th class="col-tc">时间码</th>
            <th class="col-srt-text">SRT 字幕</th>
          </tr>
        </thead>
        <tbody id="resultBody"></tbody>
      </table>
    </section>
  </section>

  <!-- ============ SRT 时间轴重定时 ============ -->
  <section id="viewRetime" class="hidden">
    <section class="input-grid">
      <div class="pane">
        <div class="pane-head">
          <label for="rtSrt">原 SRT 字幕</label>
          <button type="button" class="ghost" id="rtSampleSrt">填入示例</button>
        </div>
        <textarea id="rtSrt" spellcheck="false"
          placeholder="粘贴标准 SRT&#10;1&#10;00:00:01,000 --> 00:00:03,000&#10;你好，世界！"></textarea>
      </div>
      <div class="pane">
        <div class="pane-head">
          <label for="rtPoints">校准点（每行一组：原时间 → 目标时间）</label>
          <button type="button" class="ghost" id="rtSamplePoints">填入示例</button>
        </div>
        <textarea id="rtPoints" class="points-area" spellcheck="false"
          placeholder="每行一组，按时间顺序排列，两列均须严格递增：&#10;00:00:01,000 → 00:00:02,000&#10;00:10:00,000 → 00:15:00,000&#10;分隔符用 → / 空格 / 制表符均可；只有一点时整体平移"></textarea>
      </div>
    </section>

    <section class="controls">
      <button type="button" id="rtRunBtn" class="primary">生成预览</button>
      <button type="button" id="rtClearBtn" class="ghost">清空</button>
      <button type="button" id="rtDownloadBtn" class="ghost" disabled>下载新 SRT</button>
      <span id="rtStatus" class="status" role="status"></span>
    </section>

    <section id="rtResultWrap" class="result-wrap hidden">
      <table id="rtResultTable">
        <thead>
          <tr>
            <th class="col-rt-idx">#</th>
            <th class="col-rt-tc">原时间码</th>
            <th class="col-rt-arrow"></th>
            <th class="col-rt-tc">新时间码</th>
            <th class="col-rt-text">字幕文本</th>
          </tr>
        </thead>
        <tbody id="rtResultBody"></tbody>
      </table>
    </section>
  </section>
</main>

<script src="/static/app.js"></script>
</body>
</html>
